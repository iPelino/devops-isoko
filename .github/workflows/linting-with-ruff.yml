name: Ruff Formatting

on: 
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev"]
  workflow_dispatch: 

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.12
        
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Ruff Linting
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.12
        
      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1
        

      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME}}/isoko:latest
            ${{ secrets.DOCKERHUB_USERNAME}}/isoko:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
            
          
